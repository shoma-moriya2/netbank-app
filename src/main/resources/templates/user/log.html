<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>入出金明細</title>
	</head>
	<body>
		<div th:insert="~{common/header :: header}"></div>
		
		<p><span sec:authentication="name"></span>さんの入出金記録です。</p>
		
		<table>
			<tr th:each="item : ${log}">
				<td th:text="'（' + ${#temporals.format(item.time, 'yyyy年MM月dd日 HH:mm')} + '）'"></td>
				
				<td>
					<span th:text="${item.fromAccount.username == #authentication.name ? 
						item.toAccount.username + 'さんへ出金' : item.fromAccount.username + 'さんから入金'}"></span>
				</td>
				<td><span th:text="${item.amount.toBigInteger()} + '円'"></span></td>

			</tr>
		</table>
		
		<div th:insert="~{common/toUserHome :: toUserHome}"></div>
		
		<div th:insert="~{common/footer :: footer}"></div>
	</body>
</html>
